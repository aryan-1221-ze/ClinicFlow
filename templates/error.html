{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

<section class="panel"><p>{{ message }}</p><p><a class="btn" href="{{ url_for('main.overview') }}">Go to the overview</a></p></section>
{% endblock %}
